name: spm build hf

on:
  workflow_dispatch:
    inputs:
      amd_override:
        description: 'Overrides AMD'
        required: false
        default: 'v3'
        type: string

env:
  REPO_DIR: ${{ github.workspace }}
  TAG: v1.0.0_${{ github.event.inputs.amd_override }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_REPO: ${{ secrets.HF_REPO }}
  GOAMD64: ${{ github.event.inputs.amd_override }}

jobs:
  main-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        working-directory: gu
        run: |
          go mod download
          go version
          GOAMD64=${{ env.GOAMD64 }} CGO_ENABLED=0 go build --ldflags="-s" -o doit
          7z a -mx9 doit_${{ env.TAG }}.7z doit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Release
        run: |
          python -c "
          from huggingface_hub import upload_file
          import os
          upload_file(
              path_or_fileobj='${{ env.REPO_DIR }}/gu/doit_${{ env.TAG }}.7z',
              path_in_repo='doit_${{ env.TAG }}.7z',
              repo_id=os.environ['HF_REPO'],
              repo_type='model',
              token=os.environ['HF_TOKEN']
          )"
