name: bench secp256k1

on:
  workflow_dispatch:

#$defaults:
#  run:
#    working-directory: scripts

jobs:
  build-and-bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y cmake ninja-build clang lld libssl-dev

      - name: Cache libsecp256k1 build
        id: cache-secp
        uses: actions/cache@v6
        with:
          path: scripts/libsecp256k1
          key: secp-${{ runner.os }}-${{ hashFiles('build_secp.sh') }}

      - name: Download libsecp256k1
        if: steps.cache-secp.outputs.cache-hit != 'true'
        working-directory: scripts
        run: |
          curl -L -o secp.tar.gz \
            --url "https://github.com/bitcoin-core/secp256k1/releases/download/v0.8.0/libsecp256k1-0.8.0.tar.gz"
          tar -xf secp.tar.gz
          mv libsecp256k1-0.8.0 libsecp256k1
          rm -rf secp.tar.gz

      - name: Configure libsecp256k1
        if: steps.cache-secp.outputs.cache-hit != 'true'
        working-directory: scripts/libsecp256k1
        env:
          CC: clang
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -march=native -mavx2 -fomit-frame-pointer" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_ECMULT_GEN_KB=86 \
            -DSECP256K1_BUILD_TESTS=OFF \
            -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_BUILD_BENCHMARK=OFF

      - name: Build libsecp256k1
        if: steps.cache-secp.outputs.cache-hit != 'true'
        working-directory: scripts/libsecp256k1
        run: cmake --build build

      - name: Show CPU info
        run: lscpu | grep -E 'Model name|^CPU\(s\)|MHz'

      - name: Compile benchmark (single-threaded)
        working-directory: scripts
        run: |
          clang -O3 -march=native -mavx2 -DSECP256K1_STATIC \
            -I libsecp256k1/include \
            -o bench_st bench.c \
            libsecp256k1/build/lib/libsecp256k1.a \
            -lpthread

      - name: Run single-threaded benchmark
        working-directory: scripts
        run: ./bench_st

      - name: Compile benchmark (multi-threaded)
        working-directory: scripts
        run: |
          clang -O3 -march=native -mavx2 -DSECP256K1_STATIC -DUSE_THREADS \
            -I libsecp256k1/include \
            -o bench_mt bench.c \
            libsecp256k1/build/lib/libsecp256k1.a \
            -lpthread

      - name: Run multi-threaded benchmark
        working-directory: scripts
        run: ./bench_mt
