name: spm doit

on:
  workflow_dispatch:

env:
  TAG: v1.0.0
  REPO_DIR: ${{ github.workspace }}
  ENV_MYWEB: ${{ secrets.ENV_MYWEB }}
  ENV_ADS: ${{ secrets.ENV_ADS }}
  ENV_DISD: ${{ secrets.ENV_DISD }}
  HF_REPO: ${{ secrets.HF_REPO }}

jobs:
  main-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Doit
        run: |
          curl -o doit.7z -L \
            --url "https://huggingface.co/${{ env.HF_REPO }}/resolve/main/doit_${{ env.TAG }}.7z?download=true"
          7z x doit.7z
          rm -rf doit.7z
          chmod +x doit
          ./doit loop 5 steps 1000000 wait 0 cpu 3
