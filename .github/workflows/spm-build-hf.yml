name: Gu HF

on:
  workflow_dispatch:

env:
  REPO_DIR: ${{ github.workspace }}
  TAG: v1.0.0

jobs:
  main-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          cd gu
          go mod download
          go version
          GOAMD64=v3 CGO_ENABLED=0 go build --ldflags="-s" -trimpath -o doit
          7z a -mx9 doit_${{ env.TAG }}.7z doit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Release
        run: |
          python -c "
          from huggingface_hub import upload_file
          import os
          upload_file(
              path_or_fileobj='${{ env.REPO_DIR }}/gu/doit_${{ env.TAG }}.7z',
              path_in_repo='doit_${{ env.TAG }}.7z',
              repo_id=os.environ['HF_REPO'],
              repo_type='model',
              token=os.environ['HF_TOKEN']
          )"
